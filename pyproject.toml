[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reliability-lab"
version = "0.1.0"
description = "A reproducible RAG evaluation harness and CI quality gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vedant Patil" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
rag-eval = "raglab.cli:main"
testgen-bench = "raglab.testgen:main"
general-eval = "raglab.general_eval:main"
general-eval-judge = "raglab.general_eval_judge:main"
saved-eval-generate = "raglab.saved_eval_generate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

