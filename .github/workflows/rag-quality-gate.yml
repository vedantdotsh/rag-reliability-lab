name: RAG quality gate

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests conftest.py
      - run: pytest -q
      - name: Enforce RAG quality thresholds
        run: rag-eval evaluate --gate --report reports/ci.json --markdown reports/ci.md
      - name: Publish evaluation evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation
          path: |
            reports/ci.json
            reports/ci.md
            reports/runs.sqlite3
            dashboard/dist/
